name: APK Export (temporaer)

on:
  push:
    branches: [claude/project-thread-2sp0ga]

permissions:
  contents: write

jobs:
  export:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :core:test
      - name: Release-APK bauen (ohne Release-Schluessel)
        run: ./gradlew :app:assembleRelease
      - name: APK in den Branch legen
        run: |
          mkdir -p apk-export
          cp app/build/outputs/apk/release/*.apk apk-export/app-release.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f apk-export/app-release.apk
          git commit -m "APK-Export [skip ci]"
          git push
