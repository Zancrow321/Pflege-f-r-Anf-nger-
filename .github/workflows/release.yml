name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versions-Tag, z.B. v1.0.0"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Logik und Inhalte)
        run: ./gradlew :core:test

      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || vars.RELEASE_KEYSTORE_BASE64 }}
          S_RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          V_RELEASE_KEYSTORE_BASE64: ${{ vars.RELEASE_KEYSTORE_BASE64 }}
          S_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          V_RELEASE_KEYSTORE_PASSWORD: ${{ vars.RELEASE_KEYSTORE_PASSWORD }}
          S_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          V_RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          S_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          V_RELEASE_KEY_PASSWORD: ${{ vars.RELEASE_KEY_PASSWORD }}
        run: |
          # Nur anzeigen, OB etwas gesetzt ist (nie den Wert)
          for n in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            s="S_$n"; v="V_$n"
            if [ -n "${!s}" ]; then a=gesetzt; else a=fehlt; fi
            if [ -n "${!v}" ]; then b=gesetzt; else b=fehlt; fi
            echo "$n: als Secret $a | als Variable $b"
          done
          if [ -z "$KEYSTORE_BASE64" ]; then echo "RELEASE_KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || vars.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || vars.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || vars.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Signatur prüfen und umbenennen
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5
          cp "$APK" "Pflege-fuer-Anfaenger-${TAG}.apk"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Pflege für Anfänger ${{ env.TAG }}
          files: Pflege-fuer-Anfaenger-*.apk
          body: |
            Pflege für Anfänger – Lern-App für die kardiologische Telemetrie-Station.

            APK herunterladen und auf dem Android-Gerät installieren (Installation aus unbekannten Quellen erlauben).

            ⚠️ Alle Inhalte sind nicht fachlich geprüft. Es gelten die Standards deines Hauses und die ärztliche Anordnung.
